<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fdf4e9">
  <title>Mise — weekly meal planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- Paint the stored theme before first paint, so a dark-mode user never sees a
       white flash. Inline on purpose: app.js loads at the end of the body. -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('p5:mealplanner') || '{}');
      if (saved && (saved.theme === 'dark' || saved.theme === 'light')) {
        document.documentElement.dataset.theme = saved.theme;
      }
    } catch (err) { /* private mode, or nothing stored yet */ }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="brand"><span class="brand-mark" aria-hidden="true"></span>Mise</p>
      <button type="button" class="theme-btn" id="theme-toggle" data-action="theme"
              aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme">
        <span class="theme-icon theme-icon-sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"></path>
          </svg>
        </span>
        <span class="theme-icon theme-icon-moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"></path>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <main class="page">
    <!-- WEEK -->
    <section id="view-week" class="view" aria-labelledby="week-heading">
      <div class="view-head">
        <h1 id="week-heading">Let&rsquo;s plan your week</h1>
        <div class="week-nav">
          <button type="button" class="btn btn-quiet" data-action="expand-all" id="expand-all"
                  aria-pressed="false" aria-controls="week-grid">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.5 4.5h-5v5M14.5 19.5h5v-5M19.5 9.5v-5h-5M4.5 14.5v5h5"></path>
            </svg>
            <span id="expand-all-label">Expand all</span>
          </button>
          <button type="button" class="btn btn-quiet btn-icon" data-action="week-shift" data-delta="-1" aria-label="Previous week">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
          </button>
          <button type="button" class="btn btn-quiet" data-action="week-today">Today</button>
          <button type="button" class="btn btn-quiet btn-icon" data-action="week-shift" data-delta="1" aria-label="Next week">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>
      </div>

      <!-- Narrow screens only: picks which single day the grid below shows. -->
      <div class="day-strip" id="day-strip" role="group" aria-label="Choose a day"></div>
      <div class="week-grid" id="week-grid" tabindex="-1"></div>

      <!-- Fills the space below the week: opened by a slot's "+ Add", so the day
           and meal are already known and never asked for again. -->
      <div class="slot-picker" id="slot-picker" role="group" aria-labelledby="slot-picker-title" hidden>
        <div class="slot-picker-head">
          <h2 class="slot-picker-title" id="slot-picker-title"></h2>
          <button type="button" class="icon-btn" data-action="slot-picker-close" aria-label="Cancel">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <div class="search">
          <label class="sr-only" for="slot-search">Search recipes</label>
          <input type="search" id="slot-search" placeholder="Search by name or ingredient…" autocomplete="off">
        </div>
        <div class="pick-grid" id="slot-picker-grid"></div>
        <p class="empty" id="slot-picker-empty" hidden>No recipes match that search.</p>
      </div>
    </section>

    <!-- RECIPES -->
    <section id="view-recipes" class="view" aria-labelledby="recipes-heading" hidden>
      <div class="view-head">
        <h1 id="recipes-heading">Recipes</h1>
        <p class="view-sub" id="recipes-count"></p>
      </div>

      <div class="filters">
        <div class="filter-bar">
          <div class="search">
            <label class="sr-only" for="search">Search recipes</label>
            <input type="search" id="search" placeholder="Search by name or ingredient…" autocomplete="off">
          </div>
          <button type="button" class="btn btn-quiet filter-toggle" data-action="filters-toggle"
                  id="filter-toggle" aria-expanded="true" aria-controls="tag-filters">Filters</button>
        </div>
        <!-- Chips grouped by what they mean, so 16 tags read as four short lists. -->
        <div class="filter-groups" id="tag-filters"></div>
        <div class="filter-active" id="filter-active" hidden>
          <p class="filter-count" id="filter-count"></p>
          <button type="button" class="btn btn-quiet btn-sm" data-action="clear-tags">Clear all</button>
        </div>
      </div>

      <div class="card-grid" id="recipe-grid"></div>
      <p class="empty" id="recipes-empty" hidden>No recipes match that search.</p>
    </section>

    <!-- SAVED -->
    <section id="view-saved" class="view" aria-labelledby="saved-heading" hidden>
      <div class="view-head">
        <h1 id="saved-heading">Saved</h1>
        <p class="view-sub" id="saved-count"></p>
      </div>
      <div class="card-grid" id="saved-grid"></div>
      <p class="empty" id="saved-empty" hidden>Nothing saved yet. Tap the bookmark on any recipe to keep it here.</p>
    </section>
  </main>

  <!-- The view switch docks over the content rather than sitting in the header.
       It lives at body level on purpose: .topbar has a backdrop-filter, and a
       filtered ancestor becomes the containing block for position: fixed. -->
  <nav class="nav-wrap" aria-label="Main views">
    <ul class="nav" id="nav">
      <li><button type="button" class="nav-btn" data-action="nav" data-view="week">Week</button></li>
      <li><button type="button" class="nav-btn" data-action="nav" data-view="recipes">Recipes</button></li>
      <li><button type="button" class="nav-btn" data-action="nav" data-view="saved">Saved</button></li>
    </ul>
  </nav>

  <!-- Recipe detail -->
  <dialog id="detail" class="sheet" aria-labelledby="detail-name">
    <div class="sheet-tools">
      <!-- Save, and Add to week when there is no slot already in play. Written by
           openDetail(), which knows whether it was opened from a slot. -->
      <div class="sheet-tool-actions" id="detail-tools"></div>
      <form method="dialog">
        <button class="icon-btn sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </form>
    </div>
    <div class="sheet-body" id="detail-body"></div>
  </dialog>

  <!-- Add to week -->
  <dialog id="picker" class="sheet sheet-sm" aria-labelledby="picker-title">
    <div class="sheet-tools">
      <form method="dialog">
        <button class="icon-btn sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </form>
    </div>
    <div class="sheet-body sheet-body-center">
      <h2 id="picker-title" class="sheet-eyebrow">Add to week</h2>
      <p class="picker-recipe" id="picker-recipe"></p>

      <p class="field-label" id="picker-day-label">Day</p>
      <div class="day-picker" id="picker-days" role="group" aria-labelledby="picker-day-label"></div>

      <p class="field-label" id="picker-meal-label">Meal</p>
      <div class="segmented" id="picker-meals" role="group" aria-labelledby="picker-meal-label"></div>

      <p class="picker-note" id="picker-note" hidden></p>

      <div class="sheet-actions">
        <button type="button" class="btn btn-quiet" data-action="picker-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" data-action="picker-confirm" id="picker-confirm">Add</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
