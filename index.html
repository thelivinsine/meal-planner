<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mise — weekly meal planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="brand">Mise</p>
      <nav aria-label="Main views">
        <ul class="nav" id="nav">
          <li><button type="button" class="nav-btn" data-action="nav" data-view="week">Week</button></li>
          <li><button type="button" class="nav-btn" data-action="nav" data-view="recipes">Recipes</button></li>
          <li><button type="button" class="nav-btn" data-action="nav" data-view="saved">Saved</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page">
    <!-- WEEK -->
    <section id="view-week" class="view" aria-labelledby="week-heading">
      <div class="view-head">
        <div>
          <h1 id="week-heading">Your week</h1>
          <p class="view-sub" id="week-range"></p>
        </div>
        <div class="week-nav">
          <button type="button" class="btn btn-quiet" data-action="week-shift" data-delta="-1" aria-label="Previous week">&larr;</button>
          <button type="button" class="btn btn-quiet" data-action="week-today">This week</button>
          <button type="button" class="btn btn-quiet" data-action="week-shift" data-delta="1" aria-label="Next week">&rarr;</button>
        </div>
      </div>
      <div class="week-grid" id="week-grid"></div>

      <!-- Fills the space below the week: opened by a slot's "+ Add", so the day
           and meal are already known and never asked for again. -->
      <div class="slot-picker" id="slot-picker" role="group" aria-labelledby="slot-picker-title" hidden>
        <div class="slot-picker-head">
          <div>
            <h2 class="slot-picker-title" id="slot-picker-title"></h2>
            <p class="view-sub">Tap a recipe to fill that slot.</p>
          </div>
          <button type="button" class="icon-btn" data-action="slot-picker-close" aria-label="Cancel">&times;</button>
        </div>
        <div class="search">
          <label class="sr-only" for="slot-search">Search recipes</label>
          <input type="search" id="slot-search" placeholder="Search by name or ingredient…" autocomplete="off">
        </div>
        <div class="pick-grid" id="slot-picker-grid"></div>
        <p class="empty" id="slot-picker-empty" hidden>No recipes match that search.</p>
      </div>
    </section>

    <!-- RECIPES -->
    <section id="view-recipes" class="view" aria-labelledby="recipes-heading" hidden>
      <div class="view-head">
        <div>
          <h1 id="recipes-heading">Recipes</h1>
          <p class="view-sub" id="recipes-count"></p>
        </div>
      </div>

      <div class="filters">
        <div class="search">
          <label class="sr-only" for="search">Search recipes</label>
          <input type="search" id="search" placeholder="Search by name or ingredient…" autocomplete="off">
        </div>
        <div class="chips" id="tag-filters" role="group" aria-label="Filter by tag"></div>
      </div>

      <div class="card-grid" id="recipe-grid"></div>
      <p class="empty" id="recipes-empty" hidden>No recipes match that search.</p>
    </section>

    <!-- SAVED -->
    <section id="view-saved" class="view" aria-labelledby="saved-heading" hidden>
      <div class="view-head">
        <div>
          <h1 id="saved-heading">Saved</h1>
          <p class="view-sub" id="saved-count"></p>
        </div>
      </div>
      <div class="card-grid" id="saved-grid"></div>
      <p class="empty" id="saved-empty" hidden>Nothing saved yet. Tap the bookmark on any recipe to keep it here.</p>
    </section>
  </main>

  <!-- Recipe detail -->
  <dialog id="detail" class="sheet" aria-labelledby="detail-name">
    <form method="dialog" class="sheet-close-form">
      <button class="icon-btn sheet-close" aria-label="Close">&times;</button>
    </form>
    <div class="sheet-body" id="detail-body"></div>
  </dialog>

  <!-- Add to week -->
  <dialog id="picker" class="sheet sheet-sm" aria-labelledby="picker-title">
    <form method="dialog" class="sheet-close-form">
      <button class="icon-btn sheet-close" aria-label="Close">&times;</button>
    </form>
    <div class="sheet-body">
      <h2 id="picker-title" class="sheet-title">Add to week</h2>
      <p class="sheet-sub" id="picker-recipe"></p>

      <p class="field-label" id="picker-day-label">Day</p>
      <div class="day-picker" id="picker-days" role="group" aria-labelledby="picker-day-label"></div>

      <p class="field-label" id="picker-meal-label">Meal</p>
      <div class="segmented" id="picker-meals" role="group" aria-labelledby="picker-meal-label"></div>

      <p class="picker-note" id="picker-note" hidden></p>

      <div class="sheet-actions">
        <button type="button" class="btn btn-quiet" data-action="picker-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" data-action="picker-confirm" id="picker-confirm">Add</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
