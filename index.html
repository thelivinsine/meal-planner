<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Browser chrome follows the page. One tag, no `prefers-color-scheme`: the theme is
       a choice the user stores, not the OS preference, so a media-query pair gets it
       wrong for anyone whose theme disagrees with their system. applyTheme() rewrites
       this from the live --bg on every switch; the value here is the light --bg, which
       is what an unstyled first paint shows. -->
  <meta name="theme-color" content="#f6f3ee">
  <title>Mise — weekly meal planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- Paint the stored theme before first paint, so a dark-mode user never sees a
       white flash. Inline on purpose: app.js loads at the end of the body. The browser
       chrome gets the same treatment, and for the same reason — a light title bar over
       a dark page is the identical flash. Reading --bg back off the element rather than
       repeating the hex works because the stylesheet link above blocks this script. -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('p5:mealplanner') || '{}');
      if (saved && (saved.theme === 'dark' || saved.theme === 'light')) {
        document.documentElement.dataset.theme = saved.theme;
      }
      document.querySelector('meta[name="theme-color"]').content =
        getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    } catch (err) { /* private mode, or nothing stored yet */ }
  </script>
</head>
<body>
  <!-- Wide: the theme button alone, floated to the top right of the content column —
       the brand has moved into the sidebar. Narrow: brand left, theme right. -->
  <header class="topbar">
    <div class="topbar-inner">
      <p class="brand brand-top"><span class="brand-mark" aria-hidden="true"></span>Mise</p>
      <button type="button" class="theme-btn" id="theme-toggle" data-action="theme"
              aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme">
        <span class="theme-icon theme-icon-sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"></path>
          </svg>
        </span>
        <span class="theme-icon theme-icon-moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"></path>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <main class="page">
    <!-- WEEK -->
    <section id="view-week" class="view view-week" aria-label="Week plan">
      <!-- PARKED: the rotating week greeting. Removed from the page, kept here whole
           because it may come back. To restore: uncomment the div below, put
           `weekHeading: document.getElementById('week-heading'),` back in `el`, and
           `el.weekHeading.textContent = WEEK_GREETING;` back in the start section of
           app.js — WEEK_GREETINGS and WEEK_GREETING are still there, unused. Also send
           .week-main and .week-side back to grid-row 2 in the wide block of style.css
           and restore the .view-week > .view-head rule above it, or the greeting lands
           in the same row as the week bar.

           It sat outside .week-main so the grid could give it a row of its own: the
           summary column then started level with the week bar rather than level with
           the heading. One line, no subtitle — app.js swapped the text for a different
           greeting on every load, and the markup carried one rather than "Your week" so
           the same thing showed if the script never ran.

      <div class="view-head">
        <h1 id="week-heading">Let&rsquo;s plan your week</h1>
      </div>
      -->

      <div class="week-main">
        <!-- Week and day navigation, sitting straight on the page: the range with an
             arrow either side, and under it the seven days. No tile around it — this is
             navigation, and the meal cards below are the only boxes on the page. Same
             strip at every width. -->
        <div class="weekbar">
          <div class="weekbar-top">
            <button type="button" class="icon-btn weekbar-arrow" data-action="week-shift" data-delta="-1" aria-label="Previous week">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
            <p class="weekbar-range" id="week-range"></p>
            <button type="button" class="icon-btn weekbar-arrow" data-action="week-shift" data-delta="1" aria-label="Next week">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
            </button>
          </div>
          <div class="day-strip" id="day-strip" role="group" aria-label="Choose a day"></div>
        </div>

        <h2 class="day-title" id="day-title"></h2>
        <!-- One card per meal for the selected day. tabindex so focus has somewhere to
             land when the control that was pressed gets re-rendered away. -->
        <div class="meals" id="week-grid" tabindex="-1"></div>

        <!-- Takes the day's place rather than sitting under it: opened by a meal's
             "Add", the day and meal are already known and never asked for again. The
             day title and the three meal cards above are hidden while it is open, so
             the week bar stays put and the cards scroll inside their own area — app.js
             sets the height from the space actually left on screen. -->
        <!-- tabindex so opening the picker has somewhere to put focus: the button that
             opened it is one of the meal cards being hidden. -->
        <div class="slot-picker" id="slot-picker" role="group" aria-labelledby="slot-picker-title" tabindex="-1" hidden>
          <!-- Back link left, heading centred over the cards, search on the row below.
               Centred because that is what every other view heading here does. -->
          <div class="slot-picker-head">
            <!-- The one way back, in place of a close X: this replaced a view, so it
                 reads as navigation rather than dismissing a tray. -->
            <button type="button" class="slot-back" data-action="slot-picker-close">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
              Back to the day
            </button>
            <h2 class="slot-picker-title" id="slot-picker-title"></h2>
          </div>
          <!-- Search, layout toggle and filters, drawn by app.js from one component so
               all three lists carry the same row. Opened from a meal, the Meal filter
               arrives already set to that meal — the day and meal are known, so the
               list starts as the recipes for it rather than all fifty. -->
          <div class="filters" id="tools-slot"></div>
          <div class="pick-grid" id="slot-picker-grid"></div>
          <p class="empty" id="slot-picker-empty" hidden>No recipes match that search.</p>
        </div>
      </div>

      <!-- Wide screens only. Everything in here is derived from the day showing on the
           left, so hiding it under 1000px loses nothing you cannot see there. -->
      <aside class="week-side">
        <section class="side-card" aria-labelledby="glance-heading">
          <h2 class="side-head" id="glance-heading">
            <span class="side-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M5 19V11M12 19V5M19 19v-6"></path>
              </svg>
            </span>At a glance
          </h2>
          <div id="glance-body"></div>
        </section>

        <section class="side-card" aria-labelledby="tips-heading">
          <h2 class="side-head" id="tips-heading">
            <span class="side-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.2 17h5.6M10 20.5h4"></path>
                <path d="M12 3a6 6 0 0 0-3.4 10.9c.5.4.9 1.1.9 1.8v.3h5v-.3c0-.7.4-1.4.9-1.8A6 6 0 0 0 12 3z"></path>
              </svg>
            </span>Tips for today
          </h2>
          <p class="side-tip" id="tip-body"></p>
        </section>
      </aside>
    </section>

    <!-- RECIPES -->
    <section id="view-recipes" class="view" aria-labelledby="recipes-heading" hidden>
      <div class="view-head">
        <h1 id="recipes-heading">Recipes</h1>
        <p class="view-sub" id="recipes-count"></p>
      </div>

      <!-- Search, layout toggle and filters. Empty in the markup: app.js draws the
           same component here, on Saved and in the week's slot picker, so the three
           lists cannot drift apart. -->
      <div class="filters" id="tools-recipes"></div>

      <div class="card-grid" id="recipe-grid"></div>
      <p class="empty" id="recipes-empty" hidden>No recipes match that search.</p>
    </section>

    <!-- SAVED -->
    <section id="view-saved" class="view" aria-labelledby="saved-heading" hidden>
      <div class="view-head">
        <h1 id="saved-heading">Saved</h1>
        <p class="view-sub" id="saved-count"></p>
      </div>
      <div class="filters" id="tools-saved"></div>
      <div class="card-grid" id="saved-grid"></div>
      <!-- Text set by app.js: "nothing saved" and "nothing here matches" are two
           different dead ends and only one of them is your fault. -->
      <p class="empty" id="saved-empty" hidden></p>
    </section>
  </main>

  <!-- Wide: the left sidebar, brand on top of a vertical list. Narrow: the same list
       docked over the content as a pill, and the brand above is hidden because the top
       bar already carries it. One set of nav markup, one nav landmark, two layouts.
       It lives at body level on purpose: .topbar has a backdrop-filter, and a filtered
       ancestor becomes the containing block for position: fixed. -->
  <nav class="nav-wrap" aria-label="Main views">
    <p class="brand brand-side"><span class="brand-mark" aria-hidden="true"></span>Mise</p>
    <ul class="nav" id="nav">
      <li><button type="button" class="nav-btn" data-action="nav" data-view="week">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect>
          <path d="M3.5 10h17M8 2.8v3.4M16 2.8v3.4"></path>
        </svg><span>Week</span>
      </button></li>
      <li><button type="button" class="nav-btn" data-action="nav" data-view="recipes">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 11h17a8.5 8.5 0 0 1-8.5 8.5A8.5 8.5 0 0 1 3.5 11z"></path>
          <path d="M9 7.5c0-1.6 3-1.9 3-3.5M14.5 7.8c0-1.2 1.8-1.6 1.8-2.8"></path>
        </svg><span>Recipes</span>
      </button></li>
      <li><button type="button" class="nav-btn" data-action="nav" data-view="saved">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z"></path>
        </svg><span>Saved</span>
      </button></li>
    </ul>
  </nav>

  <!-- Recipe detail -->
  <dialog id="detail" class="sheet" aria-labelledby="detail-name">
    <div class="sheet-tools">
      <!-- Save, and Add to week when there is no slot already in play. Written by
           openDetail(), which knows whether it was opened from a slot. -->
      <div class="sheet-tool-actions" id="detail-tools"></div>
      <form method="dialog">
        <button class="icon-btn sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </form>
    </div>
    <div class="sheet-body" id="detail-body"></div>
  </dialog>

  <!-- Add to week -->
  <dialog id="picker" class="sheet sheet-sm" aria-labelledby="picker-title">
    <div class="sheet-tools">
      <form method="dialog">
        <button class="icon-btn sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </form>
    </div>
    <div class="sheet-body sheet-body-center">
      <h2 id="picker-title" class="sheet-eyebrow">Add to week</h2>
      <p class="picker-recipe" id="picker-recipe"></p>

      <p class="field-label" id="picker-day-label">Day</p>
      <div class="day-picker" id="picker-days" role="group" aria-labelledby="picker-day-label"></div>

      <p class="field-label" id="picker-meal-label">Meal</p>
      <div class="segmented" id="picker-meals" role="group" aria-labelledby="picker-meal-label"></div>

      <p class="picker-note" id="picker-note" hidden></p>

      <div class="sheet-actions">
        <button type="button" class="btn btn-quiet" data-action="picker-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" data-action="picker-confirm" id="picker-confirm">Add</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
